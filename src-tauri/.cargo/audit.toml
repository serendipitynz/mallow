# Advisories accepted by `cargo audit` (.github/workflows/audit.yml). Each entry
# names why it stays; remove it once the reason no longer holds. Unmaintained and
# unsound advisories are reported as warnings and fail nothing, so none of them
# is listed here.

[advisories]
ignore = [
  # zip 4.6.1 through tauri-plugin-updater, Windows only. The updater extracts
  # only an archive whose minisign signature has verified, so a hostile archive
  # needs the signing key. The fixed zip (9.0) arrives with updater 2.14, which
  # needs tauri 2.12, past the 2.11.3 mallow holds (TASK-53). Clears when the
  # tauri hold is lifted.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
]
