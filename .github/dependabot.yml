# Weekly version updates. Security updates are switched on in the repository
# settings and need nothing here, but the ignore rules below apply to them too.
#
# Minor and patch updates arrive as one grouped pull request per ecosystem;
# each major version gets its own, since a major is a change to read rather
# than to batch.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Auckland
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # The npm half of the tauri hold; the cargo entry below says why.
    ignore:
      - dependency-name: '@tauri-apps/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Auckland
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    # tauri's minors move by hand (AGENTS.md, "Verifying changes"): tauri-cli
    # refuses a build whose crate and npm package differ in minor, and an update
    # here cannot reach the npm half. Cargo.toml pins each tauri crate with `~`;
    # this keeps Dependabot from rewriting those pins to the next minor. Patch
    # releases still arrive.
    ignore:
      - dependency-name: 'tauri*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # The platform crates pdf.rs, modifier.rs and side_buttons.rs call into
      # share their types with wry, so each stays on the line wry uses and moves
      # with a tauri upgrade: a major of one alone (PR #115, windows-core 0.100)
      # makes wry's objects a different type and the arm stops compiling.
      - dependency-name: webview2-com
        update-types: [version-update:semver-major]
      - dependency-name: windows-core
        update-types: [version-update:semver-major]
      - dependency-name: windows-sys
        update-types: [version-update:semver-major]
      - dependency-name: 'objc2*'
        update-types: [version-update:semver-major]
      - dependency-name: block2
        update-types: [version-update:semver-major]
      - dependency-name: gtk
        update-types: [version-update:semver-major]
      - dependency-name: webkit2gtk
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Auckland
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    # Pinned to action-v0.6.2 because the shape of latest.json comes from it,
    # and action-v1 renames inputs that Actions only warns about (AGENTS.md,
    # "Signed self-update").
    ignore:
      - dependency-name: tauri-apps/tauri-action
