name: Release

# Build cross-platform bundles and attach them to a GitHub release.
#
# Trigger by pushing a version tag (e.g. `v0.1.0`), or run manually from the
# Actions tab with an explicit tag. The release is created as a DRAFT with notes
# generated from the pull requests merged since the previous tag (grouped per
# .github/release.yml) — review the assets and notes, then publish it by hand.
#
# `create-release` makes the draft once; the `build` matrix then uploads each
# platform's bundle to it by release id (so the matrix jobs never race to create
# the release). macOS builds are signed with a Developer ID Application
# certificate and notarized when the APPLE_* secrets are configured (see
# scripts/setup-ci-signing-secrets.sh). Windows and Linux bundles are unsigned.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0). A draft release with this tag is created.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # On a manual run, fail early with a clear message if the requested tag
      # does not exist yet (auto-generated notes are computed against the tag).
      - name: Verify the release tag exists (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist. Create and push it first: git tag $TAG && git push origin $TAG" >&2
            exit 1
          fi

      # Tauri names the bundles after tauri.conf.json's version, not after the
      # tag, so a tag pushed without bumping it produces a release whose assets
      # carry the previous version's name. Fail before anything is built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify the manifests match the release tag
        run: |
          set -eu
          expected="${RELEASE_TAG#v}"
          fail=0
          check() {
            if [ "$2" != "$expected" ]; then
              echo "::error::$1 declares version '$2' but the tag is '$RELEASE_TAG'. Bump with 'pnpm release $expected'." >&2
              fail=1
            fi
          }
          json_version() {
            grep -m1 '"version"' "$1" | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/'
          }
          check package.json "$(json_version package.json)"
          check src-tauri/tauri.conf.json "$(json_version src-tauri/tauri.conf.json)"
          check src-tauri/Cargo.toml "$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)".*/\1/p;}' src-tauri/Cargo.toml | head -1)"
          exit "$fail"

      - name: Create (or reuse) the draft release with generated notes
        id: release
        run: |
          set -eu
          # Reuse an existing release for this tag if present (e.g. on re-run).
          # The tags endpoint can't see drafts, so list releases and match on
          # tag_name instead.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="mallow $RELEASE_TAG" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true \
              --jq .id)
            echo "Created draft release $id for $RELEASE_TAG"
          else
            echo "Reusing existing release $id for $RELEASE_TAG"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      # tauri-action's updater-json step GETs latest.json, merges its own
      # platforms into it, deletes it and re-uploads — with no lock and no
      # conditional request. Run in parallel, two jobs read the same version and
      # the second upload drops the first one's platforms, producing a release
      # whose latest.json is silently missing a platform. Serialising the matrix
      # removes the interleaving; it is a scheduling guarantee rather than a
      # structural one, which holds here because nothing else writes that asset.
      # The alternative (includeUpdaterJson: false plus an aggregation job) is
      # structurally single-writer but has to build latest.json from the .sig
      # assets itself — a bespoke script in place of a one-line ordering
      # constraint. Release builds are the only thing slowed down.
      max-parallel: 1
      matrix:
        include:
          # Apple Silicon runner; `universal-apple-darwin` lipo-merges an Intel
          # slice too, so one .dmg covers both architectures.
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
          # Both Linux jobs run on 24.04. The x86_64 one was pinned to 22.04 to
          # keep the AppImage runnable against an older glibc (2.35 rather than
          # 2.39), but the Ubuntu 22 images — x86_64 and arm64 alike — begin
          # deprecation on 2026-09-17 and are failed outright during the
          # brownouts leading to their 2027-04-17 removal. `fail-fast: false`
          # means the other jobs still finish, so a release cut inside a
          # brownout window would produce a draft with no Linux bundles at all.
          # The wider glibc reach is given up here, deliberately, rather than
          # under a deadline during a release.
          - platform: ubuntu-24.04
            rust_targets: ''
            tauri_args: ''
          # Natively arm64, so nothing is cross-compiled and rust_targets stays
          # empty. Measured to produce deb, rpm and AppImage exactly like the
          # x86_64 job. The label only resolves on public repositories; in a
          # private one the job fails before it starts.
          - platform: ubuntu-24.04-arm
            rust_targets: ''
            tauri_args: ''
          - platform: windows-latest
            rust_targets: ''
            tauri_args: ''
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Build from the release tag itself, so a manual run can never bundle a
      # different commit than the tag names. On a tag push github.ref is already
      # refs/tags/<tag>, so this is equivalent to the default there.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Matched by prefix, not by exact label: an exact match silently skips
      # this step for any second Linux runner, and the build then fails deep in
      # webkit2gtk rather than here.
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # xdg-utils is needed because the AppImage bundler shells out to
          # /usr/bin/xdg-open, which the arm64 runner images do not ship and the
          # x86_64 ones happen to. Without it the arm64 job bundles deb and rpm
          # and then fails on the AppImage.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Pinned rather than floating on @v0: the shape of latest.json comes from
      # this action, so a new release of it would be a shipped bug. Do not jump
      # to action-v1.0.0 as a version bump — it renames inputs
      # (includeUpdaterJson -> uploadUpdaterJson, assetNamePattern ->
      # releaseAssetNamePattern) and changes the url form written into
      # latest.json, and Actions only warns about inputs it does not know, so a
      # half-migrated config would silently restore the lost-update defect that
      # max-parallel above is fixing.
      - name: Build, sign, and upload to the draft release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. Empty/unset on non-macOS runners and
          # until the secrets are configured, in which case macOS builds are
          # produced unsigned and the notarize step below fails fast.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing (minisign). The public key is committed in
          # tauri.conf.json, so a build without these produces no signatures —
          # and a key that does not match the committed one only logs a warning
          # and ships signatures every client rejects. The password secret is
          # not optional: tauri-cli substitutes an empty password when it is
          # unset, and mallow's key has one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload to the draft create-release made; do not create/edit it here,
          # so its generated notes are preserved.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Tag-pins the download urls written into latest.json. Without it they
          # read releases/latest/download/<asset> and resolve to whatever is
          # newest at download time, so the first later release that carries no
          # updater bundles turns every older client's url into a 404. This does
          # not create or edit the release: the action only does that when
          # tagName is set and releaseId is not.
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          args: ${{ matrix.tauri_args }}

      # Tauri notarizes the .app but not the .dmg that wraps it, so the disk
      # image is rejected by Gatekeeper on open. Notarize + staple the .dmg,
      # then replace the asset tauri-action already uploaded. Mirrors the local
      # scripts/macos-sign-build.sh workaround.
      - name: Notarize and staple the macOS .dmg
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No .dmg found to notarize." >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
            gh release upload "$RELEASE_TAG" "$dmg" --clobber -R "$GITHUB_REPOSITORY"
          done

  # A Linux install whose bundle type has no entry in latest.json does not stop
  # at "no update" — the client falls back to the bare `linux-<arch>` key, which
  # is the AppImage, and installs it as one. A deb install would overwrite
  # itself with AppImage bytes. Two things produce that state: a bundle type
  # that never reaches latest.json at all (rpm's upstream treatment is
  # inconsistent - it did reach latest.json in v0.7.0, which is why the key check
  # below now requires it), and tauri-bundler's per-bundle marker patch failing,
  # which is logged as a warning and leaves the binary reporting no bundle type.
  #
  # So the bare Linux keys are removed. Every Linux form that self-updates
  # resolves its own `linux-<arch>-<installer>` key, so nothing that is patched
  # correctly loses its update path; what is left is an install that finds
  # nothing and says so, instead of one that breaks itself. Deliberately Linux
  # only: `darwin-<arch>` is the documented fallback for the -app key, and the
  # Windows bare key points at the MSI, where both forms are installers that
  # handle their own upgrade.
  #
  # This runs after the whole matrix, so it is also the one place that sees the
  # finished platform set — which is what turns a lost update from a silently
  # incomplete release into a red job.
  finalize-updater-json:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Drop the bare Linux keys and verify the platform set
        run: |
          set -eu
          # The release is a draft, so browser_download_url needs auth; fetch the
          # asset through the API by id instead.
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '[.[] | select(.name == "latest.json")][0].id // empty')
          if [ -z "$asset_id" ]; then
            echo "::error::No latest.json on release $RELEASE_ID. The updater artifacts were not produced — check the build log for a signing failure." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -H 'Accept: application/octet-stream' > latest.json

          echo "platforms as built:"
          jq -r '.platforms | keys[] | "  " + .' latest.json

          mkdir -p out
          jq 'del(.platforms["linux-x86_64"], .platforms["linux-aarch64"])' latest.json > out/latest.json

          # Every entry must carry a signature; an entry without one is refused
          # at runtime, which is not visible from the release page.
          missing_sig=$(jq -r '[.platforms | to_entries[] | select((.value.signature // "") == "") | .key] | join(" ")' out/latest.json)
          if [ -n "$missing_sig" ]; then
            echo "::error::latest.json entries without a signature: $missing_sig" >&2
            exit 1
          fi

          # The lost-update defect and a job that quietly produced no bundle look
          # identical from here: a platform is simply absent. Name the ones that
          # must be present rather than trusting the matrix went green.
          # Both Linux architectures are listed, not just x86_64: the arm64 job is a
          # fourth writer of this asset, and its bare linux-aarch64 fallback was
          # just deleted above, so an arm64 entry lost here leaves those installs
          # with nothing to resolve at all. rpm is listed as of v0.7.0, whose
          # latest.json answered the question decision-11 left open by carrying
          # linux-x86_64-rpm and linux-aarch64-rpm: the READMEs now tell rpm users
          # an update reaches them, so an upstream change that stops signing .rpm
          # has to fail here rather than strand them silently.
          for key in \
            darwin-aarch64 darwin-x86_64 \
            windows-x86_64-nsis windows-x86_64-msi \
            linux-x86_64-appimage linux-x86_64-deb linux-x86_64-rpm \
            linux-aarch64-appimage linux-aarch64-deb linux-aarch64-rpm; do
            if [ "$(jq -r --arg k "$key" '.platforms | has($k)' out/latest.json)" != "true" ]; then
              echo "::error::latest.json has no '$key' entry. A build job produced no bundle, or two jobs raced on this asset." >&2
              exit 1
            fi
          done

          echo "platforms as shipped:"
          jq -r '.platforms | keys[] | "  " + .' out/latest.json

          gh release upload "$RELEASE_TAG" out/latest.json --clobber -R "$GITHUB_REPOSITORY"
