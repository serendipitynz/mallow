name: Check

# The repository's first check workflow. Runs the same set AGENTS.md's
# "Verifying changes" section names, so the documented list and the enforced
# list cannot drift apart.
#
# `biome ci` is the non-writing variant intended for this. It fails on errors
# but not on warnings, so a rule left at warn gates nothing here. Keep any rule
# this workflow is meant to enforce at `error` in biome.json rather than reaching
# for --error-on-warnings, which would promote every warn-level rule at once,
# including ones nobody triaged.
#
# The frontend and Rust halves are separate jobs so a failure names which side
# broke, and so the Rust job's system dependencies and toolchain cache do not
# slow the frontend one down.

on:
  pull_request:
  push:
    branches:
      - main

# Both jobs only read the checkout. Set the floor here while this is the
# repository's first check workflow, rather than inheriting the default scope.
permissions:
  contents: read

# Superseding a run is right on a pull request, where only the tip matters, and
# wrong on main: a release has to be able to tell whether a given commit was
# verified, and a cancelled run cannot answer that.
#
# `cancel-in-progress: false` alone would not achieve it. A queued run also
# evicts whatever was already *pending* in its group, so three pushes to main in
# quick succession leave the middle commit cancelled — the same hole, moved. So
# main pushes get a group per commit instead, where nothing can contend and
# nothing is ever pending; only pull requests share a group per ref.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint:ci

      - name: Type-check and bundle
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # release.yml's package list minus xdg-utils, which only its AppImage
      # bundler needs — the Tauri crate does not compile without the WebKitGTK
      # headers, hence the rest. Deliberately not the same runner either:
      # release.yml pins its Linux images because the bundles it produces
      # inherit that image's glibc floor, whereas this job produces no artifact
      # and so tracks ubuntu-latest. Verified on ubuntu-24.04: every package
      # below, libappindicator3-dev included, resolves from noble/universe.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Tests
        working-directory: src-tauri
        run: cargo test
