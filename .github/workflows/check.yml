name: Check

# The repository's first check workflow. Runs the same set AGENTS.md's
# "Verifying changes" section names, so the documented list and the enforced
# list cannot drift apart.
#
# `biome ci` is the non-writing variant intended for this. It fails on errors
# but not on warnings, which is what lets style/useBlockStatements sit at warn
# until TASK-16 converts the bodies still in the tree. Do NOT add
# --error-on-warnings while any rule is parked at warn — that is a reasonable
# tightening only once nothing is.
#
# The frontend and Rust halves are separate jobs so a failure names which side
# broke, and so the Rust job's system dependencies and toolchain cache do not
# slow the frontend one down.

on:
  pull_request:
  push:
    branches:
      - main

# Both jobs only read the checkout. Set the floor here while this is the
# repository's first check workflow, rather than inheriting the default scope.
permissions:
  contents: read

# Superseding a push is right on a pull request, where only the tip matters. It
# is wrong on main: cancelling there leaves a merge commit whose checks never
# finished, so a release cannot tell whether that commit was ever verified.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint:ci

      - name: Type-check and bundle
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same package list release.yml installs for its Linux bundle — the
      # Tauri crate does not compile without the WebKitGTK headers — but
      # deliberately not the same runner. release.yml pins ubuntu-22.04 so the
      # AppImage it produces stays runnable on older glibc (release.yml:116);
      # this job bundles nothing, so it has no stake in that and tracks
      # ubuntu-latest instead, which is also what keeps it clear of the 22.04
      # deprecation TASK-17 has to weigh. Verified on ubuntu-24.04: every package
      # below, libappindicator3-dev included, resolves from noble/universe.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Tests
        working-directory: src-tauri
        run: cargo test
