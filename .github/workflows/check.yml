name: Check

# The repository's first check workflow. Runs the same set AGENTS.md's
# "Verifying changes" section names, so the documented list and the enforced
# list cannot drift apart.
#
# `biome ci` is the non-writing variant intended for this. It fails on errors
# but not on warnings, so a rule left at warn gates nothing here. Keep any rule
# this workflow is meant to enforce at `error` in biome.json rather than reaching
# for --error-on-warnings, which would promote every warn-level rule at once,
# including ones nobody triaged.
#
# The frontend and Rust halves are separate jobs so a failure names which side
# broke, and so the Rust job's system dependencies and toolchain cache do not
# slow the frontend one down.

on:
  pull_request:
  push:
    branches:
      - main
  # The paper job is the only thing `workflow_dispatch` is here for: it is the
  # switch that produces a platform's first paper, which is what a baseline is
  # made from.
  workflow_dispatch:

# Both jobs only read the checkout. Set the floor here while this is the
# repository's first check workflow, rather than inheriting the default scope.
permissions:
  contents: read

# Superseding a run is right on a pull request, where only the tip matters, and
# wrong on main: a release has to be able to tell whether a given commit was
# verified, and a cancelled run cannot answer that.
#
# `cancel-in-progress: false` alone would not achieve it. A queued run also
# evicts whatever was already *pending* in its group, so three pushes to main in
# quick succession leave the middle commit cancelled — the same hole, moved. So
# main pushes get a group per commit instead, where nothing can contend and
# nothing is ever pending; only pull requests share a group per ref.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint:ci

      - name: Type-check and bundle
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # release.yml's package list minus xdg-utils, which only its AppImage
      # bundler needs — the Tauri crate does not compile without the WebKitGTK
      # headers, hence the rest. Deliberately not the same runner either:
      # release.yml pins its Linux images because the bundles it produces
      # inherit that image's glibc floor, whereas this job produces no artifact
      # and so tracks ubuntu-latest. Verified on ubuntu-24.04: every package
      # below, libappindicator3-dev included, resolves from noble/universe.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # Whether this pull request touches anything the paper depends on. A job of its
  # own because GitHub's `paths:` filter is per-workflow, not per-job — putting the
  # paper's paths at the top would stop the two jobs above from running on every
  # other change, which is the opposite of what they are for. `git diff` against
  # the base needs no third-party action to do it.
  paper-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      paper: ${{ steps.filter.outputs.paper }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "changed files:"; echo "$changed"
          # What can change the paper: the stylesheet that paginates it, the three
          # platform arms that write it, the view it is made from, the mode that
          # produces it without a person, the script that measures it, and this
          # workflow.
          if echo "$changed" | grep -qE '^(src/styles/print\.scss|src-tauri/src/(pdf|unattended)\.rs|src-tauri/build\.rs|src/lib/(pdf-export|markdown-preview|build-flags|render-signal)\.ts|src/components/MarkdownView\.tsx|src/App\.tsx|src/unattended/|scripts/paper/|vite\.config\.ts|\.github/workflows/check\.yml)'; then
            echo 'paper=true' >> "$GITHUB_OUTPUT"
          else
            echo 'paper=false' >> "$GITHUB_OUTPUT"
          fi

  # ---- The paper ------------------------------------------------------------
  # Builds the unattended export on all three platforms, writes the fixture's PDF
  # in both themes, and measures it. **This is not a replacement for a person
  # opening the paper** — it measures what a number can settle (the document
  # reached its end, no app shell, the type is the size it was, the file is not a
  # runaway) and leaves the rest, so a person only opens papers that already
  # passed.
  #
  # It also compiles `src-tauri/src/pdf.rs` on Windows and macOS, which nothing
  # else here does: the two jobs above are ubuntu, so before this job the Windows
  # arm's first compile was whoever measured it by hand.
  #
  # **Not on every pull request.** Three OS Rust builds cost several times what
  # the two jobs above do, so this runs when the paper's own inputs change, or on
  # demand. Not on `main` pushes either — paper is looked at in a pull request.
  paper:
    needs: paper-paths
    # `!cancelled()` rather than `always()`, and rather than nothing at all: the
    # filter job does not run on a manual dispatch, and a skipped dependency skips
    # its dependents unless the condition says otherwise.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.paper-paths.outputs.paper == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    # TASK-24's lesson, applied before it can happen here: an install step with no
    # ceiling can hold a runner until the workflow's own limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # release.yml's list plus what a paper needs: a display to open a window on,
      # Japanese fonts for a fixture written in Japanese, and poppler to measure
      # with. Without the fonts the text is tofu, which measures as a paper rather
      # than as a missing font.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            fonts-noto-cjk \
            poppler-utils

      - name: Install poppler (macOS)
        if: matrix.platform == 'macos'
        run: brew install poppler

      # Pinned release rather than a package manager: the runner's package
      # indexes name and version poppler differently over time, and a measurement
      # that cannot run is indistinguishable from a paper that failed.
      - name: Install poppler (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip'
          Invoke-WebRequest -Uri $url -OutFile poppler.zip
          Expand-Archive -Path poppler.zip -DestinationPath $env:RUNNER_TEMP\poppler
          "$env:RUNNER_TEMP\poppler\poppler-24.08.0\Library\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: paper-${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      # The unattended export's own tests are `cfg(unattended)`, so the `cargo
      # test` in the job above never compiles them. This is the only place they run.
      - name: Unattended-mode Rust tests
        working-directory: src-tauri
        env:
          MALLOW_UNATTENDED: '1'
        run: cargo test

      - name: Build the unattended export
        env:
          MALLOW_UNATTENDED: '1'
        run: pnpm tauri build --debug --no-bundle --no-sign

      - name: Write and measure the paper
        shell: bash
        env:
          MALLOW_BIN: ${{ matrix.platform == 'windows' && 'src-tauri/target/debug/mallow.exe' || 'src-tauri/target/debug/mallow' }}
        run: |
          set -euo pipefail
          mkdir -p paper
          run_export() {
            if [ "${{ matrix.platform }}" = "linux" ]; then
              xvfb-run -a "$MALLOW_BIN" --document scripts/paper/print-pagebreaks.md --out "$1" --theme "$2"
            else
              "$MALLOW_BIN" --document scripts/paper/print-pagebreaks.md --out "$1" --theme "$2"
            fi
          }
          status=0
          for theme in light dark; do
            pdf="paper/paper-${{ matrix.platform }}-$theme.pdf"
            echo "### ${{ matrix.platform }} / $theme" >> "$GITHUB_STEP_SUMMARY"
            if ! run_export "$pdf" "$theme"; then
              echo "the unattended export failed (exit $?) — no paper to measure" >> "$GITHUB_STEP_SUMMARY"
              status=1
              continue
            fi
            node scripts/paper/measure-paper.mjs "$pdf" --os ${{ matrix.platform }} --theme "$theme" \
              --json > "paper/paper-${{ matrix.platform }}-$theme.json" || status=1
            node scripts/paper/measure-paper.mjs "$pdf" --os ${{ matrix.platform }} --theme "$theme" \
              >> "$GITHUB_STEP_SUMMARY" || true
          done
          exit $status

      # Uploaded whether the measurement passed or failed: a failing paper is the
      # one worth opening.
      - name: Keep the paper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.platform }}
          path: paper/
          retention-days: 14
