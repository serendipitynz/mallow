<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mallow</title>
    <script>
      // Apply the saved colour choice before first paint to avoid a flash of the
      // wrong scheme. This is a copy of `readChoice` and `drawnMode` in
      // `lib/color-choice`, because it runs before any module is loaded; keep the
      // two in step. Nothing stored is written here.
      (function () {
        function get(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null; /* private mode / disabled storage: read as nothing stored */
          }
        }
        var legacy = {
          auto: ['standard', 'auto'],
          light: ['standard', 'light'],
          dark: ['standard', 'dark'],
          'solarized-light': ['solarized', 'light'],
          'solarized-dark': ['solarized', 'dark'],
          dracula: ['dracula', 'dark'],
          nord: ['nord', 'dark'],
        };
        var sides = { standard: ['light', 'dark'], solarized: ['light', 'dark'], dracula: ['dark'], nord: ['dark'] };
        var old = get('theme');
        var base = old !== null && legacy.hasOwnProperty(old) ? legacy[old] : ['standard', 'auto'];
        var family = get('colorFamily');
        var mode = get('colorMode');
        if (family === null) {
          family = base[0];
        }
        if (mode === null) {
          mode = base[1];
        }
        if (!sides.hasOwnProperty(family) || (mode !== 'light' && mode !== 'dark' && mode !== 'auto')) {
          family = 'standard';
          mode = 'auto';
        }
        if (mode === 'auto') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (sides[family].indexOf(mode) < 0) {
          mode = sides[family][0];
        }
        document.documentElement.dataset.colorFamily = family;
        document.documentElement.dataset.colorMode = mode;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
